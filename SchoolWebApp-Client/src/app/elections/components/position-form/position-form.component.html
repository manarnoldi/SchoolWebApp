<div class="modal-backdrop fade show"></div>
<div class="modal fade show d-block" tabindex="-1">
    <div class="modal-dialog modal-xl" style="margin-top: 40px;">
        <div class="modal-content">
            <div class="modal-header py-2">
                <h5 class="modal-title"><i class="fas fa-user-tie text-info me-1"></i>{{ position ? 'Edit position' : 'New position' }}</h5>
                <button type="button" class="btn-close" (click)="closed.emit()"></button>
            </div>
            <div class="modal-body">
                <div class="row g-3">
                    <!-- Left: what the position is -->
                    <div class="col-lg-5">
                        <div class="row g-2">
                            <div class="col-9">
                                <label class="form-label mb-0 small">Position</label>
                                <input class="form-control form-control-sm" [(ngModel)]="model.name" maxlength="255" placeholder="e.g. School President">
                            </div>
                            <div class="col-3">
                                <label class="form-label mb-0 small">Seats</label>
                                <input type="number" min="1" max="20" class="form-control form-control-sm" [(ngModel)]="model.seats">
                            </div>
                            <div class="col-12"><small class="text-muted">{{ seatsHint }}</small></div>

                            <div class="col-12">
                                <label class="form-label mb-0 small">Races</label>
                                <div class="form-check" *ngFor="let s of scopes">
                                    <input class="form-check-input" type="radio" name="scope" [id]="'scope' + s" [value]="s" [(ngModel)]="model.scope">
                                    <label class="form-check-label small" [for]="'scope' + s">
                                        <b>{{ scopeLabels[s] }}</b> <span class="text-muted">- {{ scopeHints[s] }}</span></label>
                                </div>
                            </div>

                            <div class="col-12">
                                <label class="form-label mb-0 small">Gender rule</label>
                                <select class="form-select form-select-sm" [(ngModel)]="model.genderRule">
                                    <option *ngFor="let g of genderRules" [ngValue]="g">{{ genderRuleLabels[g] }}</option>
                                </select>
                                <small class="text-muted" *ngIf="model.genderRule == GenderRule.SeatsPerGender">e.g. one boy and one girl per class.</small>
                            </div>
                            <ng-container *ngIf="model.genderRule == GenderRule.SingleGender">
                                <div class="col-6">
                                    <label class="form-label mb-0 small">Candidates must be</label>
                                    <select class="form-select form-select-sm" [(ngModel)]="model.genderId">
                                        <option [ngValue]="null">Choose...</option>
                                        <option *ngFor="let g of options.genders" [ngValue]="g.id">{{ g.name }}</option>
                                    </select>
                                </div>
                                <div class="col-6 d-flex align-items-end">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="sameGender" [(ngModel)]="model.votersSameGenderOnly">
                                        <label class="form-check-label small" for="sameGender">Only voters of that gender vote</label>
                                    </div>
                                </div>
                            </ng-container>

                            <div class="col-12">
                                <div class="form-check" [title]="runningMateAllowed ? '' : 'A joint ticket elects one ticket - one seat and no seats per gender'">
                                    <input class="form-check-input" type="checkbox" id="runningMate" [(ngModel)]="hasRunningMate" [disabled]="!runningMateAllowed">
                                    <label class="form-check-label small" for="runningMate"><b>Joint ticket</b> - each candidate stands with a running mate; one vote elects both.</label>
                                </div>
                                <input *ngIf="hasRunningMate && runningMateAllowed" class="form-control form-control-sm mt-1" [(ngModel)]="model.runningMateTitle"
                                    maxlength="255" placeholder="Running mate's title, e.g. Deputy President">
                            </div>
                        </div>
                    </div>

                    <!-- Right: who votes and who may stand -->
                    <div class="col-lg-7">
                        <label class="form-label mb-0 small">Grades that vote</label>
                        <div class="border rounded p-2 mb-2">
                            <div *ngFor="let s of options.sections" class="d-flex flex-wrap align-items-center gap-2 mb-1">
                                <button type="button" class="btn btn-xs btn-sm py-0 px-1" style="min-width: 140px;"
                                    [ngClass]="sectionAllVoters(s.id) ? 'btn-info' : 'btn-outline-info'" (click)="toggleSection(s.id)"
                                    title="Tick or clear the whole section">{{ s.name }}</button>
                                <div class="form-check form-check-inline me-1" *ngFor="let g of s.grades">
                                    <input class="form-check-input" type="checkbox" [id]="'v' + g.id" [checked]="isVoter(g.id)" (change)="toggleVoter(g.id)">
                                    <label class="form-check-label small" [for]="'v' + g.id">{{ g.name }}</label>
                                </div>
                            </div>
                        </div>
                        <div class="alert alert-light border py-1 px-2 small mb-2"><i class="fas fa-sitemap text-info me-1"></i>{{ contestPreview }}</div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="limitCand" [(ngModel)]="limitCandidates" [disabled]="model.voterLevelIds.length === 0">
                            <label class="form-check-label small" for="limitCand">Only some of these grades may stand <span class="text-muted">(e.g. only Grade 6 and Grade 9 for President)</span></label>
                        </div>
                        <div class="border rounded p-2" *ngIf="limitCandidates">
                            <div *ngFor="let s of voterSections" class="d-flex flex-wrap align-items-center gap-2 mb-1">
                                <span class="small text-muted" style="min-width: 140px;">{{ s.name }}</span>
                                <div class="form-check form-check-inline me-1" *ngFor="let g of s.grades">
                                    <input class="form-check-input" type="checkbox" [id]="'c' + g.id" [checked]="isCandidate(g.id)" (change)="toggleCandidate(g.id)">
                                    <label class="form-check-label small" [for]="'c' + g.id">{{ g.name }}</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer py-2">
                <button class="btn btn-sm btn-secondary" (click)="closed.emit()">Cancel</button>
                <button class="btn btn-sm btn-primary" [disabled]="saving" (click)="save()">
                    <i class="fas" [ngClass]="saving ? 'fa-spinner fa-spin' : 'fa-save'"></i> Save position</button>
            </div>
        </div>
    </div>
</div>
