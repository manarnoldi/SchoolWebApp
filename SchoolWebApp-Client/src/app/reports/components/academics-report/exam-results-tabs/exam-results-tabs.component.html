<app-dashboard-header [title]="dashboardTitle" [breadcrumbs]="breadcrumbs"></app-dashboard-header>
<hr class="mb-1">
<section class="content">
    <div class="container-fluid px-1">
        <div class="card card-primary card-outline mb-1">
            <div class="card-header p-1">
                <ul class="nav nav-pills" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button type="button" class="nav-link {{ activeNav === 'exam' ? 'active' : '' }}"
                            (click)="setTab('exam')">
                            <i class="fas fa-table me-1"></i> Exam Results
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button type="button" class="nav-link {{ activeNav === 'reportForm' ? 'active' : '' }}"
                            (click)="setTab('reportForm')">
                            <i class="fas fa-file-alt me-1"></i> Report Forms
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button type="button" class="nav-link {{ activeNav === 'missing' ? 'active' : '' }}"
                            (click)="setTab('missing')">
                            <i class="fas fa-exclamation-triangle me-1"></i> Missing Marks
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button type="button" class="nav-link {{ activeNav === 'classProgress' ? 'active' : '' }}"
                            (click)="setTab('classProgress')">
                            <i class="fas fa-users me-1"></i> Class Exam Progress
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button type="button" class="nav-link {{ activeNav === 'studentProgress' ? 'active' : '' }}"
                            (click)="setTab('studentProgress')">
                            <i class="fas fa-user-graduate me-1"></i> Student Exam Progress
                        </button>
                    </li>
                </ul>
            </div>
            <div class="card-body p-1">
                <div [hidden]="activeNav !== 'exam'">
                    <app-broadsheet *ngIf="visited['exam']"></app-broadsheet>
                </div>
                <div [hidden]="activeNav !== 'reportForm'">
                    <app-report-form *ngIf="visited['reportForm']"></app-report-form>
                </div>
                <div [hidden]="activeNav !== 'missing'">
                    <app-missing-marks-report *ngIf="visited['missing']"></app-missing-marks-report>
                </div>
                <div [hidden]="activeNav !== 'classProgress'">
                    <app-exam-progress *ngIf="visited['classProgress']" mode="class"></app-exam-progress>
                </div>
                <div [hidden]="activeNav !== 'studentProgress'">
                    <app-exam-progress *ngIf="visited['studentProgress']" mode="student"></app-exam-progress>
                </div>
            </div>
        </div>
    </div>
</section>
