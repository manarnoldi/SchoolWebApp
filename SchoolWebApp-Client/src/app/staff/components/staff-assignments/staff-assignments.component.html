<app-dashboard-header
    [title]="dashboardTitle"
    [breadcrumbs]="breadcrumbs"></app-dashboard-header>
<hr class="mb-1">

<section class="content">
    <div class="container-fluid px-1">
        <div class="row g-0 py-1">
            <div class="col-12">
                <a [routerLink]="[backLinkUrl]"
                    class="btn btn-sm btn-flat btn-warning float-left">
                    <i class="fas fa-angle-double-left"></i> Back to staff list
                </a>
            </div>
        </div>

        <div class="card">
            <div class="card-body p-1">
                <div class="row g-0">
                    <div class="col-12">
                        <app-staff-details-view [staffDetails]="staff" [statuses]="statuses"
                            *ngIf="statuses"></app-staff-details-view>
                    </div>
                </div>
                <div class="row g-0 pt-1">
                    <div class="col-12">
                        <div class="card card-success card-outline mb-1">
                            <div class="card-header p-1">
                                <ul class="nav nav-pills" id="pills-tab" role="tablist">
                                    <li class="nav-item" role="presentation">
                                        <button
                                            class="nav-link {{activeNav==='attendance'? 'active':''}}"
                                            id="attendance-tab" (click)="selectTab('attendance')"
                                            data-bs-toggle="pill" data-bs-target="#attendance"
                                            type="button" role="tab" aria-controls="attendance"
                                            aria-selected="true">Attendance details</button>
                                    </li>
                                    <li class="nav-item" role="presentation">
                                        <button
                                            class="nav-link {{activeNav==='discipline'? 'active':''}}"
                                            id="discipline-tab" (click)="selectTab('discipline')"
                                            data-bs-toggle="pill" data-bs-target="#discipline"
                                            type="button" role="tab" aria-controls="discipline"
                                            aria-selected="false">Discipline details</button>
                                    </li>
                                    <li class="nav-item" role="presentation" *ngIf="teachingStaff">
                                        <button
                                            class="nav-link {{activeNav==='subjects'? 'active':''}}"
                                            id="subjects-tab" (click)="selectTab('subjects')"
                                            data-bs-toggle="pill"
                                            data-bs-target="#subjects" type="button" role="tab"
                                            aria-controls="subjects" aria-selected="false">
                                            Subjects assignments details
                                        </button>
                                    </li>
                                    <li class="nav-item" role="presentation" *ngIf="teachingStaff && showTeaching">
                                        <button
                                            class="nav-link {{activeNav==='teaching'? 'active':''}}"
                                            id="teaching-tab" (click)="selectTab('teaching')"
                                            data-bs-toggle="pill" data-bs-target="#teaching"
                                            type="button" role="tab" aria-controls="teaching"
                                            aria-selected="false">Teaching documents</button>
                                    </li>
                                    <li class="nav-item" role="presentation" *ngIf="showPay">
                                        <button
                                            class="nav-link {{activeNav==='pay'? 'active':''}}"
                                            id="pay-tab" (click)="selectTab('pay')"
                                            data-bs-toggle="pill" data-bs-target="#pay"
                                            type="button" role="tab" aria-controls="pay"
                                            aria-selected="false">Pay</button>
                                    </li>
                                    <li class="nav-item" role="presentation">
                                        <button
                                            class="nav-link {{activeNav==='duties'? 'active':''}}"
                                            id="duties-tab" (click)="selectTab('duties')"
                                            data-bs-toggle="pill" data-bs-target="#duties"
                                            type="button" role="tab" aria-controls="duties"
                                            aria-selected="false">Duties</button>
                                    </li>
                                </ul>
                            </div>
                            <div class="card-body p-1">
                                <div class="tab-content" id="pills-tabContent">
                                    <div
                                        class="tab-pane fade {{activeNav==='attendance'? 'show active':''}}"
                                        id="attendance"
                                        role="tabpanel"
                                        aria-labelledby="attendance-tab">
                                        <div class="border border-info rounded p-1 pt-0">
                                            <app-staff-attendance [statuses]="statuses"
                                                [staff]="staff"></app-staff-attendance>
                                        </div>
                                    </div>
                                    <div
                                        class="tab-pane fade {{activeNav==='discipline'? 'show active':''}}"
                                        id="discipline" role="tabpanel"
                                        aria-labelledby="discipline-tab">
                                        <div class="border border-info rounded p-1 pt-0">
                                            <app-staff-discipline [statuses]="statuses"
                                                [staff]="staff" [outcomes]="outcomes"
                                                [occurenceTypes]="occurenceTypes"></app-staff-discipline>
                                        </div>
                                    </div>
                                    <div  *ngIf="teachingStaff"
                                        class="tab-pane fade {{activeNav==='subjects'? 'show active':''}}"
                                        id="subjects" role="tabpanel"
                                        aria-labelledby="subjects-tab">
                                        <div class="border border-info rounded p-1 pt-0">
                                            <app-staff-subject [statuses]="statuses"
                                                [staff]="staff" ></app-staff-subject>
                                        </div>
                                    </div>
                                    <div *ngIf="teachingStaff && showTeaching"
                                        class="tab-pane fade {{activeNav==='teaching'? 'show active':''}}"
                                        id="teaching" role="tabpanel"
                                        aria-labelledby="teaching-tab">
                                        <div class="border border-info rounded p-1">
                                            <app-staff-teaching *ngIf="staff && opened.has('teaching')" [staffId]="+staff.id"></app-staff-teaching>
                                        </div>
                                    </div>
                                    <div *ngIf="showPay"
                                        class="tab-pane fade {{activeNav==='pay'? 'show active':''}}"
                                        id="pay" role="tabpanel"
                                        aria-labelledby="pay-tab">
                                        <div class="border border-info rounded p-1">
                                            <app-staff-pay *ngIf="staff && opened.has('pay')" [staffId]="+staff.id"></app-staff-pay>
                                        </div>
                                    </div>
                                    <div
                                        class="tab-pane fade {{activeNav==='duties'? 'show active':''}}"
                                        id="duties" role="tabpanel"
                                        aria-labelledby="duties-tab">
                                        <div class="border border-info rounded p-1">
                                            <app-staff-duties *ngIf="staff && opened.has('duties')" [staffId]="+staff.id"></app-staff-duties>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</section>
