<app-dashboard-header
    [title]="dashboardTitle"
    [breadcrumbs]="breadcrumbs"></app-dashboard-header>
<hr class="mb-1">

<section class="content">
    <div class="container-fluid px-1">
        <div class="row g-0 py-1">
            <div class="col-12">
                <a [routerLink]="[backLinkUrl]"
                    class="btn btn-sm btn-flat btn-warning float-left">
                    <i class="fas fa-angle-double-left"></i> Back to students list
                </a>
            </div>
        </div>

        <div class="card">
            <div class="card-body p-1">
                <div class="row g-0">
                    <div class="col-12">
                        <app-student-details-view [studentDetails]="student" [statuses]="statuses"
                            *ngIf="statuses && student"></app-student-details-view>
                    </div>
                </div>
                <div class="row g-0 pt-1">
                    <div class="col-12">
                        <div class="card card-success card-outline mb-1">
                            <div class="card-header p-1">
                                <ul class="nav nav-pills" id="pills-tab" role="tablist">
                                    <li class="nav-item" role="presentation">
                                        <button
                                            class="nav-link {{activeNav === 'formerSchool'? 'active':''}}"
                                            id="formerSchool-tab"
                                            data-bs-toggle="pill" data-bs-target="#formerSchool"
                                            type="button" role="tab" aria-controls="formerSchool"
                                            aria-selected="true">Former school/s</button>
                                    </li>
                                    <li class="nav-item" role="class">
                                        <button
                                            class="nav-link {{activeNav === 'class'? 'active':''}}"
                                            id="class-tab"
                                            data-bs-toggle="pill" data-bs-target="#class"
                                            type="button" role="tab" aria-controls="class"
                                            aria-selected="false">Class details</button>
                                    </li>
                                    <li class="nav-item" role="presentation">
                                        <button
                                            class="nav-link {{activeNav === 'parents'? 'active':''}}"
                                            id="parents-tab"
                                            data-bs-toggle="pill"
                                            data-bs-target="#parents" type="button" role="tab"
                                            aria-controls="parents" aria-selected="false">
                                            Parents details
                                        </button>
                                    </li>
                                    <li class="nav-item" role="presentation">
                                        <button
                                            class="nav-link {{activeNav === 'discipline'? 'active':''}}"
                                            id="discipline-tab"
                                            data-bs-toggle="pill" data-bs-target="#discipline"
                                            type="button" role="tab" aria-controls="discipline"
                                            aria-selected="true">Discipline records</button>
                                    </li>
                                    <li class="nav-item" role="presentation">
                                        <button
                                            class="nav-link {{activeNav === 'subjects'? 'active':''}}"
                                            id="subjects-tab"
                                            data-bs-toggle="pill" data-bs-target="#subjects"
                                            type="button" role="tab" aria-controls="subjects"
                                            aria-selected="false">Subjects details</button>
                                    </li>
                                    <li class="nav-item" role="presentation">
                                        <button
                                            class="nav-link {{activeNav === 'attendance'? 'active':''}}"
                                            id="attendance-tab"
                                            data-bs-toggle="pill"
                                            data-bs-target="#attendance" type="button" role="tab"
                                            aria-controls="attendance" aria-selected="false">
                                            Attendance details
                                        </button>
                                    </li>
                                    <li class="nav-item" role="presentation" *ngIf="showAcademics">
                                        <button
                                            class="nav-link {{activeNav === 'academics'? 'active':''}}"
                                            id="academics-tab" (click)="opened.add('academics')"
                                            data-bs-toggle="pill" data-bs-target="#academics"
                                            type="button" role="tab" aria-controls="academics"
                                            aria-selected="false">Academics</button>
                                    </li>
                                    <li class="nav-item" role="presentation" *ngIf="showFees">
                                        <button
                                            class="nav-link {{activeNav === 'fees'? 'active':''}}"
                                            id="fees-tab" (click)="opened.add('fees')"
                                            data-bs-toggle="pill" data-bs-target="#fees"
                                            type="button" role="tab" aria-controls="fees"
                                            aria-selected="false">Fees</button>
                                    </li>
                                    <li class="nav-item" role="presentation">
                                        <button
                                            class="nav-link {{activeNav === 'activities'? 'active':''}}"
                                            id="activities-tab" (click)="opened.add('activities')"
                                            data-bs-toggle="pill" data-bs-target="#activities"
                                            type="button" role="tab" aria-controls="activities"
                                            aria-selected="false">Leadership &amp; activities</button>
                                    </li>
                                </ul>
                            </div>
                            <div class="card-body p-1 ">
                                <div class="tab-content" id="pills-tabContent">
                                    <div
                                        class="tab-pane fade {{activeNav === 'formerSchool'? 'show active':''}}"
                                        id="formerSchool"
                                        role="tabpanel"
                                        aria-labelledby="formerSchool-tab">
                                        <div class="border border-info rounded p-1  pt-0">
                                            <app-student-former-school [statuses]="status"
                                                [student]="student" [curricula]="curricula" *ngIf="curricula && educationLevels"
                                                [educationLevels]="educationLevels"></app-student-former-school>
                                        </div>
                                    </div>
                                    <div
                                        class="tab-pane fade {{activeNav === 'class'? 'show active':''}}"
                                        id="class" role="tabpanel"
                                        aria-labelledby="class-tab">
                                        <div class="border border-info rounded p-1  pt-0">
                                            <app-student-class [statuses]="statuses"
                                                [student]="student" [academicYears]="academicYears"
                                                *ngIf="student && academicYears && learningLevels && schoolStreams"
                                                [learningLevels]="learningLevels"
                                                [schoolStreams]="schoolStreams"></app-student-class>
                                        </div>
                                    </div>
                                    <div
                                        class="tab-pane fade {{activeNav === 'parents'? 'show active':''}}"
                                        id="parents" role="tabpanel"
                                        aria-labelledby="parents-tab">
                                        <div class="border border-info rounded p-1  pt-0">
                                            <app-student-parents [statuses]="statuses"
                                                [student]="student"
                                                *ngIf="student"></app-student-parents>
                                        </div>
                                    </div>
                                    <div
                                        class="tab-pane fade {{activeNav === 'discipline'? 'show active':''}}"
                                        id="discipline" role="tabpanel"
                                        aria-labelledby="discipline-tab">
                                        <div class="border border-info rounded p-1  pt-0">
                                            <app-student-discipline [statuses]="statuses"
                                                [student]="student" [outcomes]="outcomes"
                                                [occurenceTypes]="occurenceTypes"></app-student-discipline>
                                        </div>
                                    </div>
                                    <div
                                        class="tab-pane fade {{activeNav === 'subjects'? 'show active':''}}"
                                        id="subjects" role="tabpanel"
                                        aria-labelledby="subjects-tab">
                                        <div class="border border-info rounded p-1  pt-0">
                                            <app-student-subjects [statuses]="statuses"
                                            [student]="student" *ngIf="student"></app-student-subjects>
                                        </div>
                                    </div>
                                    <div
                                        class="tab-pane fade {{activeNav === 'attendance'? 'show active':''}}"
                                        id="attendance" role="tabpanel"
                                        aria-labelledby="attendance-tab">
                                        <div class="border border-info rounded p-1  pt-0">
                                            <app-student-attendance [student]="student" [statuses]="statuses"></app-student-attendance>
                                        </div>
                                    </div>
                                    <div *ngIf="showAcademics"
                                        class="tab-pane fade {{activeNav === 'academics'? 'show active':''}}"
                                        id="academics" role="tabpanel"
                                        aria-labelledby="academics-tab">
                                        <div class="border border-info rounded p-1">
                                            <app-student-academics *ngIf="student && (opened.has('academics') || activeNav === 'academics')" [studentId]="+student.id" [studentName]="student.fullName"></app-student-academics>
                                        </div>
                                    </div>
                                    <div *ngIf="showFees"
                                        class="tab-pane fade {{activeNav === 'fees'? 'show active':''}}"
                                        id="fees" role="tabpanel"
                                        aria-labelledby="fees-tab">
                                        <div class="border border-info rounded p-1">
                                            <app-student-fees *ngIf="student && (opened.has('fees') || activeNav === 'fees')" [studentId]="+student.id"></app-student-fees>
                                        </div>
                                    </div>
                                    <div
                                        class="tab-pane fade {{activeNav === 'activities'? 'show active':''}}"
                                        id="activities" role="tabpanel"
                                        aria-labelledby="activities-tab">
                                        <div class="border border-info rounded p-1">
                                            <app-student-activities *ngIf="student && (opened.has('activities') || activeNav === 'activities')" [studentId]="+student.id"></app-student-activities>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
