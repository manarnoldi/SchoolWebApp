<div class="card card-outline card-danger">
    <!-- A compact header, as the module cards above have. -->
    <div class="card-header py-1 d-flex align-items-center">
        <span class="card-title-sm me-auto"><i class="far fa-calendar-alt text-danger me-1"></i>Upcoming events</span>
        <a class="small" *ngIf="canManageEvents" [routerLink]="['/school/events']" [queryParams]="{source: 'dashboard'}"
           title="Add or manage the school's events">Add event</a>
    </div>
    <div class="card-body p-1 eventCard">
        <div class="text-center text-muted small py-3" *ngIf="upcomingEvents.length === 0">
            <i class="far fa-calendar-check me-1"></i> No upcoming events.
        </div>
        <div *ngFor="let event of upcomingEvents">
            <app-events-dashboard-item [event]="event"></app-events-dashboard-item>
        </div>
    </div>
</div>
