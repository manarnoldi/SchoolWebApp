<form [formGroup]="todoListItemAddForm" (ngSubmit)="onSubmit()" novalidate>
    <div class="row g-2 align-items-start">
        <div class="col-md-6">
            <textarea placeholder="What needs doing?"
                class="form-control form-control-sm" id="itemName" rows="2"
                formControlName="itemName" [ngClass]="{ 'is-invalid': (f.itemName.dirty ||
                f.itemName.touched) && f.itemName.invalid }"></textarea>
            <div class="invalid-feedback">Say what needs doing.</div>
        </div>
        <div class="col-md-4 col-8">
            <input id="completeBy" type="datetime-local" class="form-control form-control-sm" title="Complete by"
                formControlName="completeBy" [ngClass]="{ 'is-invalid': (f.completeBy.dirty ||
                f.completeBy.touched) && f.completeBy.invalid }" />
            <div class="invalid-feedback">When should it be done by?</div>
        </div>
        <div class="col-md-2 col-4 d-flex gap-1 justify-content-end">
            <button type="submit" [disabled]="todoListItemAddForm.invalid" class="btn btn-sm btn-primary"
                [title]="editmode ? 'Save the changes' : 'Add the task'">
                <i class="fas" [ngClass]="editmode ? 'fa-check' : 'fa-plus'"></i>
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary" (click)="clearControls()"
                [title]="editmode ? 'Cancel editing' : 'Clear'">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>
</form>
