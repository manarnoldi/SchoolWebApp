<ng-container *ngIf="open">
    <div class="modal-backdrop fade show"></div>
    <div class="modal fade show d-block" tabindex="-1" (click)="close()">
        <div class="modal-dialog modal-xl modal-dialog-scrollable" (click)="$event.stopPropagation()">
            <div class="modal-content">
                <div class="modal-header py-2">
                    <button class="btn btn-sm btn-outline-secondary me-2" *ngIf="stack.length > 1 || backLabel" (click)="back()"
                        [title]="stack.length > 1 ? 'Back' : 'Back to ' + backLabel"><i class="fas fa-arrow-left"></i></button>
                    <div class="flex-grow-1 me-2">
                        <div class="trail" *ngIf="stack.length > 1 || backLabel">
                            <ng-container *ngIf="backLabel"><a role="button" (click)="close()">{{ backLabel }}</a><span class="mx-1">›</span></ng-container>
                            <ng-container *ngFor="let s of stack; let i = index; let last = last">
                                <a role="button" *ngIf="!last" (click)="backTo(i)">{{ s.title }}</a>
                                <span *ngIf="!last" class="mx-1">›</span>
                            </ng-container>
                        </div>
                        <h5 class="modal-title mb-0">{{ view?.title || 'Loading...' }}</h5>
                        <small class="text-muted">{{ view?.subtitle }}</small>
                    </div>
                    <ng-container *ngIf="view">
                        <button class="btn btn-sm btn-outline-success me-1" (click)="exportCsv()" *ngIf="view.sections.length" title="Download as CSV"><i class="fas fa-file-csv"></i></button>
                        <button class="btn btn-sm btn-outline-secondary me-2" (click)="print()" title="Print"><i class="fas fa-print"></i></button>
                    </ng-container>
                    <button type="button" class="btn-close" (click)="close()" title="Close"></button>
                </div>
                <div class="modal-body p-2" [class.dim]="loading">
                    <div class="text-center text-muted p-4" *ngIf="loading && !view"><i class="fas fa-spinner fa-spin me-1"></i> Loading...</div>
                    <ng-container *ngIf="view">
                        <div class="row g-2 mb-2" *ngIf="view.fields.length">
                            <div class="col-6 col-md-3" *ngFor="let f of view.fields">
                                <small class="text-muted d-block">{{ f.label }}</small>
                                <a role="button" class="drill-link fw-semibold" *ngIf="f.drill && f.value; else plain" (click)="drill(f.drill)">{{ fmt(f.value) }} <i class="fas fa-angle-right"></i></a>
                                <ng-template #plain><span class="fw-semibold">{{ fmt(f.value) || '-' }}</span></ng-template>
                            </div>
                        </div>
                        <div *ngFor="let s of view.sections" class="mb-2">
                            <h6 class="mb-1" *ngIf="s.title">{{ s.title }} <span class="badge bg-secondary">{{ s.rows.length }}</span></h6>
                            <div class="table-responsive">
                                <table class="table table-sm table-striped table-hover mb-0">
                                    <thead class="table-light"><tr><th *ngFor="let c of s.columns">{{ c }}</th><th></th></tr></thead>
                                    <tbody>
                                        <tr *ngFor="let r of s.rows | slice: 0 : limit(s)" [class.drill-row]="r.drill" (click)="drill(r.drill)"
                                            [title]="r.drill ? 'Open' : ''">
                                            <td *ngFor="let c of r.cells" [class.text-end]="isNumber(c)" [class.text-nowrap]="isNumber(c)">{{ fmt(c) }}</td>
                                            <td class="text-end text-muted"><i class="fas fa-angle-right" *ngIf="r.drill"></i></td>
                                        </tr>
                                        <tr *ngIf="!s.rows.length"><td [attr.colspan]="s.columns.length + 1" class="text-center text-muted">No transactions.</td></tr>
                                    </tbody>
                                    <tfoot *ngIf="s.footer">
                                        <tr class="table-warning fw-bold"><td *ngFor="let c of s.footer" [class.text-end]="isNumber(c)" class="text-nowrap">{{ fmt(c) }}</td><td></td></tr>
                                    </tfoot>
                                </table>
                            </div>
                            <button class="btn btn-sm btn-link" *ngIf="s.rows.length > limit(s)" (click)="showAll(s)">Show all {{ s.rows.length }}</button>
                        </div>
                    </ng-container>
                </div>
            </div>
        </div>
    </div>
</ng-container>
